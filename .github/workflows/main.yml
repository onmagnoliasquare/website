# Main development workflow.

name: "Dev"

on:
  push:
    branches: ["dev"]
    paths-ignore:
      # Ignore changes in documentation.
      - "**/*.md"

      # Ignore changes in root directory.
      - ".gitattributes"
      - ".gitignore"
      - ".markdownlint.json"
      - ".yarnrc.yml"
      - "LICENSE"
      - ".yarn"
      - ".vscode"
      - ".prettierignore"
      - ".prettierrc"
      - "LICENSE"
      - "tsconfig.json"
      - "eslint.config.mjs"
      # This will ignore svelte.config.js
      - "**/*.config.js"
      - "**/*.config.mjs"
      - "**/*.config.cjs"

      # Ignore changes in .github directory.
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.*"
      - ".github/dependabot.yml"

      # We do in fact want to see direct changes to CI, to check if everything is working. So we'll count this in.
      # - ".github/actions/**"

      # Ignore build related files.
      - ".env.example"

      # Ignore frontend package specific paths.
      - "packages/frontend/static/**"
      - "packages/frontend/.prettierrc"

      # Ignore cms package specific paths.
      - "packages/cms/static/**"
  pull_request:
    branches: ["dev"]
    paths-ignore:
      # Ignore changes in documentation.
      - "**/*.md"

      # Ignore changes in root directory.
      - ".gitattributes"
      - ".gitignore"
      - ".markdownlint.json"
      - ".yarnrc.yml"
      - "LICENSE"
      - ".yarn"
      - ".vscode"
      - ".prettierignore"
      - ".prettierrc"
      - "LICENSE"
      - "tsconfig.json"
      - "eslint.config.mjs"
      # This will ignore svelte.config.js
      - "**/*.config.js"
      - "**/*.config.mjs"
      - "**/*.config.cjs"

      # Ignore changes in .github directory.
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.*"
      - ".github/dependabot.yml"

      # We do in fact want to see direct changes to CI, to check if everything is working. So we'll count this in.
      # - ".github/actions/**"

      # Ignore build related files.
      - ".env.example"

      # Ignore frontend package specific paths.
      - "packages/frontend/static/**"
      - "packages/frontend/.prettierrc"

      # Ignore cms package specific paths.
      - "packages/cms/static/**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      cms: ${{ steps.filter.outputs.cms }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # ratchet:dorny/paths-filter@v4
        id: filter
        with:
          base: dev
          # base: ${{ github.ref_name }}
          list-files: csv
          filters: |
            frontend:
              - 'packages/frontend/**'
            cms:
              - 'packages/cms/**'
            ci:
              - '.github/actions/**'
              - '.github/workflows/**'
      - name: Log all filter results
        run: |
          echo "frontend: ${{ steps.filter.outputs.frontend }}"
          echo "cms: ${{ steps.filter.outputs.cms }}"
          echo "ci: ${{ steps.filter.outputs.ci }}"

  build:
    name: Build artifacts
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    needs: [changes]
    environment: development
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_TITLE: ${{ vars.SANITY_STUDIO_TITLE }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}

    # Need to check if the CI can still build in the event a CI-related file is changed.
    if: ${{ (needs.changes.outputs.cms == 'true' || needs.changes.outputs.frontend == 'true') || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node

      # Run this BEFORE Eslint, since `check` generates a tsconfig.
      - name: SvelteKit check
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
        run: yarn workspace frontend check

      - name: Frontend linting
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: yarn workspace frontend lint

      - name: Build frontend for development
        if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true') && github.event_name == 'pull_request' }}
        run: yarn workspace frontend build:development

      - name: cms linting
        if: ${{ needs.changes.outputs.cms == 'true' || needs.changes.outputs.ci == 'true' }}
        run: yarn workspace cms lint

      - name: Build cms for development
        if: ${{ (needs.changes.outputs.cms == 'true' || needs.changes.outputs.ci == 'true') && github.event_name == 'pull_request' }}
        run: yarn workspace cms build

      # Cache the build after all is said and done.
      # This build will be used in the following jobs.
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

  test-unit:
    name: Unit tests
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    needs: [changes, build]
    if: ${{ github.event_name == 'pull_request' }}
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node
      - name: Restore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Run frontend unit tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend test-ci:unit

      - name: Run cms unit tests
        if: ${{ needs.changes.outputs.cms == 'true' }}
        run: yarn workspace cms test-ci:unit

  test-comp:
    name: Component tests
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    needs: [changes, build]
    if: ${{ github.event_name == 'pull_request' }}
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node
      - name: Restore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Run frontend component tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend test-ci:components

  test-int:
    name: Integration tests
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    if: ${{ needs.changes.outputs.frontend == 'true' && github.event_name == 'pull_request' }}
    needs: [changes, build]
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}
      DEBUG: "pw:api"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node
      - name: Restore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Install playwright
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend playwright install --with-deps

      - name: Run frontend integration tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend test-ci:integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integration
          path: packages/frontend/playwright-report/
          retention-days: 30

  test-func:
    name: Functional tests
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    if: ${{ needs.changes.outputs.frontend == 'true' && github.event_name == 'pull_request' }}
    needs: [changes, build]
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}
      DEBUG: "pw:api"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node
      - name: Restore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Install playwright
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend playwright install --with-deps

      - name: Run frontend functional tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend test-ci:functional

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-functional
          path: packages/frontend/playwright-report/
          retention-days: 30

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-${{vars.RUNNER_VERSION}}
    if: ${{ needs.changes.outputs.frontend == 'true' && github.event_name == 'pull_request' }}
    needs: [changes, build]
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_DEVELOPER_TOKEN: ${{ secrets.SANITY_DEVELOPER_TOKEN }}
      DEBUG: "pw:api"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node
      - name: Restore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Install playwright
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend playwright install --with-deps

      - name: Run frontend E2E tests
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend test-ci:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: packages/frontend/playwright-report/
          retention-days: 30

  deploy-staging:
    name: Deploy to staging environment
    if: ${{ (github.event_name == 'push' || github.event_name == 'merge_queue') && github.ref_name == 'dev' }}
    needs: [changes, build]
    runs-on: ubuntu-${{ vars.RUNNER_VERSION }}
    environment: staging
    env:
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_TITLE: ${{ vars.SANITY_STUDIO_TITLE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: "Setup Node.js with Yarn"
        uses: ./.github/actions/setup-node

      - name: Build frontend for staging
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: yarn workspace frontend build:staging

      - name: Build cms for staging
        if: ${{ needs.changes.outputs.cms == 'true' }}
        run: yarn workspace cms build

      - name: Deploy frontend to Cloudflare Workers (staging)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # ratchet:cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "packages/frontend"
          command: deploy --env staging

          # - name: Deploy cms to Cloudflare Workers (staging)
          #   if: ${{ needs.changes.outputs.cms == 'true' }}
          #   uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # ratchet:cloudflare/wrangler-action@v3
          #   with:
          #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          #     workingDirectory: "packages/cms"
          #     command: deploy --env staging

  all-green:
    name: All Green
    if: always()
    runs-on: ubuntu-${{ vars.RUNNER_VERSION }}
    needs: [changes, build, test-unit, test-comp, test-int, test-func, test-e2e, deploy-staging]
    steps:
      - if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 1











